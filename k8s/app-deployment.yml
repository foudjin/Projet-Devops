apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-enseignants-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-enseignants
  template:
    metadata:
      labels:
        app: gestion-enseignants
    spec:
      containers:
      - name: app
        image: medomfoudjin/gestion-enseignants:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: REDIS_URL
          value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-enseignants-service
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
  selector:
    app: gestion-enseignants